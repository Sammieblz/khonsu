services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        INSTALL_SCIENCE: ${INSTALL_SCIENCE:-true}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KHONSU_CORS_ORIGINS: ${KHONSU_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KHONSU_FIXTURE_DIR: /app/fixtures
      KHONSU_NOTEBOOK_DB: /app/data/notebooks.sqlite3
    volumes:
      - notebook-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  notebook-data:

