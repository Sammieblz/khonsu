# Opt in with: docker compose -f compose.yaml -f compose.tunnel.yaml up -d api cloudflared
# Dashboard route: api.khonsulive.earth -> http://api:8000 (Docker service DNS).
services:
  api:
    restart: unless-stopped
    environment:
      KHONSU_CORS_ORIGINS: ${KHONSU_TUNNEL_CORS_ORIGINS:-https://khonsulive.earth,https://www.khonsulive.earth,http://localhost:3000,http://127.0.0.1:3000}

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  cloudflare_tunnel_token:
    file: ${KHONSU_TUNNEL_TOKEN_FILE:-./.secrets/cloudflare-tunnel-token}
